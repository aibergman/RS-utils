[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-band"
version = "1.0.1"
authors = [
    {name = "TB-LMTO Analysis Suite", email = "contact@example.com"},
]
description = "Real-space to Band structure analysis for TB-LMTO"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["electronic-structure", "band-structure", "density-of-states", "tb-lmto", "physics", "materials-science"]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "spglib>=2.0.0",
]

[project.optional-dependencies]
full = ["pymatgen>=2022.0.0"]
dev = ["pytest>=6.0.0", "black", "flake8"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/username/rs_band"
Documentation = "https://github.com/username/rs_band/blob/main/README.md"
Repository = "https://github.com/username/rs_band.git"
"Bug Tracker" = "https://github.com/username/rs_band/issues"

[project.scripts]
rs-band = "rs_band.cli:main"
rs-band-quick = "rs_band.cli:quick_analysis"
rs-band-dos = "rs_band.cli:dos_analysis"
rs-band-projections = "rs_band.cli:projection_analysis"

[tool.setuptools.packages.find]
where = ["."]
include = ["rs_band*"]

[tool.setuptools.package-data]
rs_band = [
    "examples/*.nml",
    "examples/*.dat", 
    "examples/*.md",
    "examples/*.py",
    "docs/*.rst",
    "docs/*.md", 
    "docs/conf.py",
    "docs/_static/*",
    "docs/_templates/*"
]
