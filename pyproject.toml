[build-system]
requires = ["setuptools", "wheel", "cmake", "f90wrap>0.2.10", "numpy>1.19"]

[tool.cibuildwheel]
skip = "pp* *-musllinux* cp36* cp37* cp38*"  # Skip PyPy and musl Linux builds
before-build ='python -m pip install --upgrade numpy>1.19 ninja f90wrap'
