[build-system]
requires = ["flit_core>=3.8", "numpy", "cmake"]
build-backend = "flit_core.buildapi"

[project]
name = "rsutil"
version = "0.1.0"
description = "A Fortran-powered lattice processing tool"
authors = [{ name = "Your Name", email = "your@email.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.7"
dependencies = ["numpy", "click"]

[project.urls]
Homepage = "https://github.com/yourusername/rsutil"
Repository = "https://github.com/yourusername/rsutil"

[project.scripts]
rsutil = "rsutil.cli:cli"

