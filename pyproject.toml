[build-system]
requires = ["setuptools", "wheel", "cmake", "f90wrap>0.2.10", "numpy>=1.20", "pyvista", "pymatgen", "f90nml", "matplotlib>=3.5.0", "scipy>=1.7.0", "spglib>=2.0.0"]

[tool.cibuildwheel]
skip = "pp* *-musllinux* cp36* cp37* cp38*"  # Skip PyPy and musl Linux builds
before-build = "python -m pip install --upgrade numpy>1.19 ninja f90wrap scipy"
# test-requires = ["pytest"]
# test-command = "pytest {package}/tests"

[tool.cibuildwheel.linux]
before-all = "yum clean packages && yum install -y python3-devel ninja-build"
