name: Release

# Builds wheels for Linux and macOS plus the sdist, then publishes them with
# PyPI trusted publishing (no API tokens). One-time setup on pypi.org and
# test.pypi.org is described in docs/RELEASE_CHECKLIST.md.
#
#   - push of a tag vX.Y.Z  -> publish to PyPI
#   - manual run            -> choose testpypi (default) or pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -oP '__version__ = "\K[^"]+' rsutil/_version.py)
          echo "package version: $version, tag: $GITHUB_REF_NAME"
          test "$GITHUB_REF_NAME" = "v$version"

  build:
    uses: ./.github/workflows/build_cibuildwheel.yaml

  publish:
    needs: [check_version, build]
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v4
        with:
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
          path: dist

      - name: List distributions
        run: ls -l dist

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to TestPyPI
        if: github.event_name != 'push' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
