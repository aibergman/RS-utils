name: Build and Test with pip

on:
  push:
  pull_request:

jobs:
  python39_import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pymatgen f90nml

      - name: Import Python 3.9 runtime
        run: |
          python -c "import rsutil; import rsutil.exchange; from rsutil.core import StructureSite"

  source_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Fortran build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Confirm source package starts without a native artifact
        run: |
          python - <<'PY'
          from pathlib import Path

          package_dir = Path("rsutil")
          native = sorted(
              path
              for pattern in ("rsutil*.so", "rsutil*.dylib", "rsutil*.pyd", "rsutil*.dll")
              for path in package_dir.glob(pattern)
              if path.is_file()
          )
          assert not native, f"stale native artifacts found before install: {native}"
          print("source package is free of native build artifacts")
          PY

      - name: Install editable package and HT test dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip check

      - name: Assert editable package and native extension paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import rsutil

          package_path = Path(rsutil.__file__).resolve()
          assert rsutil._rsutil is not None
          assert rsutil.lib_path is not None
          native_path = Path(rsutil.lib_path).resolve()
          assert native_path.is_file()
          assert native_path.parent == package_path.parent
          assert native_path.suffix in {".so", ".dylib", ".pyd", ".dll"}
          print(f"rsutil Python: {package_path}")
          print(f"rsutil native: {native_path}")
          PY

      - name: Run source/editable tests
        run: |
          python -m pytest -q

  wheel_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Fortran build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Install wheel builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build exactly one wheel
        run: |
          rm -rf wheelhouse
          mkdir wheelhouse
          python -m build --wheel --outdir wheelhouse
          wheel_count=$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')
          test "$wheel_count" -eq 1
          wheel_path=$(find wheelhouse -maxdepth 1 -type f -name '*.whl' -print -quit)
          echo "RSUTIL_WHEEL=$PWD/$wheel_path" >> "$GITHUB_ENV"

      - name: Create external wheel environment
        run: |
          venv_path="$RUNNER_TEMP/rsutil-wheel-venv"
          suite_path="$RUNNER_TEMP/rsutil-wheel-suite"
          python -m venv "$venv_path"
          "$venv_path/bin/python" -m pip install --upgrade pip
          "$venv_path/bin/python" -m pip install "$RSUTIL_WHEEL[test]"
          "$venv_path/bin/python" -m pip check
          mkdir -p "$suite_path"
          cp -R tests examples "$suite_path/"

      - name: Assert installed package and native extension paths
        run: |
          venv_path="$RUNNER_TEMP/rsutil-wheel-venv"
          suite_path="$RUNNER_TEMP/rsutil-wheel-suite"
          cd "$suite_path"
          env -u PYTHONPATH PATH="$venv_path/bin:$PATH" "$venv_path/bin/python" - <<'PY'
          import importlib.util
          import pathlib
          import site
          import sys
          import rsutil

          site_roots = [pathlib.Path(path).resolve() for path in site.getsitepackages()]
          package_path = pathlib.Path(rsutil.__file__).resolve()
          native_spec = importlib.util.find_spec("rsutil.rsutil")
          assert native_spec is not None and native_spec.origin is not None
          native_path = pathlib.Path(native_spec.origin).resolve()
          assert rsutil._rsutil is not None
          assert rsutil.lib_path is not None
          loaded_native_path = pathlib.Path(rsutil.lib_path).resolve()
          assert any(root == package_path or root in package_path.parents for root in site_roots)
          assert any(root == native_path or root in native_path.parents for root in site_roots)
          assert native_path.parent == package_path.parent
          assert loaded_native_path == native_path
          assert native_path.suffix in {".so", ".dylib", ".pyd"}
          print(f"Python: {sys.executable}")
          print(f"rsutil.__file__: {package_path}")
          print(f"native extension: {native_path}")
          print("site-packages assertion: PASS")
          PY

      - name: Run external full wheel suite
        run: |
          venv_path="$RUNNER_TEMP/rsutil-wheel-venv"
          suite_path="$RUNNER_TEMP/rsutil-wheel-suite"
          cd "$suite_path"
          env -u PYTHONPATH PATH="$venv_path/bin:$PATH" "$venv_path/bin/python" -m pytest -q "$suite_path/tests"

      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: rsutil-wheel
          path: wheelhouse/*.whl
