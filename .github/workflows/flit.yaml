name: Publish Python Package with Flit

on:
  push:
  release:
    types:
      - created

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Flit
        run: pip install flit

      - name: Install Flit
        run: flit build

      - name: Upload artifact
        uses: actions/upload-artifact@v2



