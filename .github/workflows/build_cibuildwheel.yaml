name: Build wheels with cibuildwheel

on:
  push:
    branches:
      - main
      - HT
  pull_request:
    branches:
      - main
      - HT
  workflow_dispatch:
    inputs:
      quick:
        description: "Debug: build only CPython 3.12"
        type: boolean
        default: false
  # Reused by release.yaml, which publishes what this builds.
  workflow_call:

jobs:
  build_wheels:
    name: wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
            macos_target: "14.0"
          - name: macos-x86_64
            os: macos-15-intel
            macos_target: "13.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc >/dev/null 2>&1 || brew install gcc
          gfortran --version

      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel>=3.4,<4'

      - name: Build wheels
        env:
          CIBW_BUILD: ${{ inputs.quick && 'cp312-*' || 'cp311-* cp312-* cp313-* cp314-*' }}
          # Homebrew's libgfortran/libquadmath require the runner's own macOS
          # version, which would make the wheels uninstallable on older systems,
          # so setup.py links the Fortran runtime statically into our library.
          CIBW_ENVIRONMENT_MACOS: >-
            FC=gfortran
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}
            RSUTIL_STATIC_FORTRAN_RUNTIME=1
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Inspect the macOS native library
        if: runner.os == 'macOS'
        run: |
          rm -rf inspect && mkdir inspect
          for wheel in wheelhouse/*cp312*.whl; do unzip -q "$wheel" -d inspect; done
          so=$(find inspect -name 'rsutil*.so' | head -1)
          echo "== $so"; echo "-- linked libraries:"; otool -L "$so"
          echo "-- minimum macOS:"; otool -l "$so" | grep -A4 LC_BUILD_VERSION
          echo "-- bundled dylibs (expect none):"; find inspect -name '*.dylib' || true
          echo "-- undefined symbols:"; nm -u "$so" | sort -u

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
