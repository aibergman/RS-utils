name: Build wheels with cibuildwheel

on:
  push:
    branches:
      - main
      - HT
  pull_request:
    branches:
      - main
      - HT
  workflow_dispatch:

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The protected Python extension is built and tested on the supported
        # Linux toolchain here. The native CMake workflow covers the legacy
        # non-Python builds on other operating systems.
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip python3-venv

      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel>=2.20,<3'

      - name: Install Python development headers (macOS)
        if: runner.os == 'macOS'
        run: |
           brew install python  # Ensure latest Python and headers are available

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*
