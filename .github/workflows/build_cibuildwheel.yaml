name: Build wheels with cibuildwheel

on:
  push:
    branches:
      - main
      - HT
  pull_request:
    branches:
      - main
      - HT
  workflow_dispatch:
  # Reused by release.yaml, which publishes what this builds.
  workflow_call:

jobs:
  build_wheels:
    name: wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
            macos_target: "14.0"
          - name: macos-x86_64
            os: macos-15-intel
            macos_target: "13.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gfortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc >/dev/null 2>&1 || brew install gcc
          gfortran --version

      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel>=3.4,<4'

      - name: Build wheels
        env:
          CIBW_ENVIRONMENT_MACOS: FC=gfortran MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_target }}
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build_sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and check the sdist
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
