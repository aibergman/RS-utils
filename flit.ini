[build-system]
requires = ["flit_core>=3.8", "numpy", "cmake"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
include = ["rsutil/_rsutil*.so"]

[tool.flit.hook]
build = "rsutil.build_hook:copy_so_file"

[tool.flit.metadata]
module = "rsutil"

[tool.flit.build]
script = "rsutil.build_hook:run_cmake"

